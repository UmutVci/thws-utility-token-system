name: thws_token_frontend
description: "THWS Utility Token App – Frontend"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # QR Code
  qr_flutter: ^4.1.0

  # Externe Links (Telefon, Mail, Web)
  url_launcher: ^6.3.0

  # iOS Style Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
